<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>TURN credential test — AETHER//PROTOCOL</title>
<style>
  body{background:#0b0d12;color:#cfe;font:13px/1.5 ui-monospace,Consolas,monospace;padding:24px;max-width:820px;margin:0 auto}
  h1{font-size:16px;letter-spacing:2px;color:#8ef}
  p{color:#8a9}
  input{width:100%;background:#141824;color:#cfe;border:1px solid #2a3348;padding:7px;font:inherit;margin:3px 0 10px}
  button{background:#1d2740;color:#8ef;border:1px solid #3a4a6a;padding:9px 16px;font:inherit;cursor:pointer}
  button:hover{background:#26334f}
  #out{white-space:pre-wrap;margin-top:16px;border-top:1px solid #2a3348;padding-top:12px}
  .ok{color:#6f6}.bad{color:#f77}.dim{color:#678}
</style>
</head>
<body>
<h1>TURN CREDENTIAL TEST</h1>
<p>Paste one TURN server's details and press Test. This gathers ICE with
<code>iceTransportPolicy:'relay'</code>, which suppresses all non-relay candidates —
so a <span class="ok">relay candidate</span> proves the server works, and none proves it doesn't.
Run it on the deployed HTTPS URL, not <code>file://</code>.</p>

<label>TURN URL</label>
<input id="url" value="turn:free.expressturn.com:3478">
<label>Username</label>
<input id="user" placeholder="from your provider dashboard">
<label>Credential / password</label>
<input id="cred" placeholder="from your provider dashboard">
<button id="go">Test</button>
<div id="out"></div>

<script>
const $=id=>document.getElementById(id);
function log(msg,cls){const d=document.createElement('div');if(cls)d.className=cls;d.textContent=msg;$('out').appendChild(d);}

$('go').onclick=()=>{
  $('out').innerHTML='';
  const server={urls:$('url').value.trim(),username:$('user').value,credential:$('cred').value};
  if(!server.urls){log('Enter a TURN URL.','bad');return;}
  log('Testing '+server.urls+' …','dim');

  let pc;
  try{ pc=new RTCPeerConnection({iceServers:[server],iceTransportPolicy:'relay'}); }
  catch(e){ log('Could not create RTCPeerConnection: '+e.message,'bad'); return; }

  let got=false, done=false;
  const finish=()=>{
    if(done)return; done=true;
    try{pc.close()}catch(e){}
    if(got)log('\nRESULT: WORKING — paste this into TURN_SERVERS in js/net.js.','ok');
    else log('\nRESULT: NOT WORKING — no relay candidate. Wrong credentials, '+
             'expired account, or the server is down/blocked on this network.','bad');
  };

  pc.onicecandidate=e=>{
    if(e.candidate){
      const c=e.candidate.candidate;
      if(/ typ relay/.test(c)){ got=true; log('relay candidate: '+c,'ok'); }
      else log('candidate: '+c,'dim');
    } else { log('gathering complete.','dim'); finish(); }
  };
  pc.onicecandidateerror=e=>{
    // 401/403 here = server reachable but credentials rejected — the useful case
    log('ICE error '+e.errorCode+' from '+(e.url||'?')+': '+e.errorText,'bad');
  };
  pc.createDataChannel('probe');
  pc.createOffer().then(o=>pc.setLocalDescription(o))
    .catch(e=>{log('offer failed: '+e.message,'bad');finish();});
  setTimeout(finish,8000);
};
</script>
</body>
</html>
